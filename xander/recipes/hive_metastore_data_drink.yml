# Hive Metastore (Thrift) — ingest all tables in database data_drink
#
# To keep browse (blf-prod-hive → hive) consistent with other BLF DBs, prefer the unified recipe:
#   xander/recipes/hive_metastore_blf_prod_core_dbs.yml
#
# Dataset URN pattern:
#   urn:li:dataset:(urn:li:dataPlatform:hive,blf-prod-hive.data_drink.<table>,PROD)
#
# Prerequisites: pip install 'acryl-datahub[hive-metastore]'
# Browse stability: env PROD + platform_instance blf-prod-hive + catalog_name hive (same as unified recipe).
# Runtime: HMS_THRIFT_HOST, HMS_THRIFT_PORT, DATAHUB_GMS_URL, optional DATAHUB_GMS_TOKEN
#
source:
  type: hive-metastore
  config:
    connection_type: thrift
    host_port: "${HMS_THRIFT_HOST}:${HMS_THRIFT_PORT}"
    use_kerberos: false

    env: PROD
    platform_instance: blf-prod-hive
    catalog_name: hive
    emit_storage_lineage: false
    hive_storage_lineage_direction: upstream
    include_column_lineage: true
    include_view_lineage: true

    database_pattern:
      allow:
        - "^data_drink$"
    table_pattern:
      allow:
        - "^data_drink\\..*$"

sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS_URL}"
