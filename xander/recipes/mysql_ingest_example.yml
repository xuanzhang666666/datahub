{
  "source": {
    "type": "mysql",
    "config": {
      "host_port": "<mysql_host>:3306",
      "username": "${MYSQL_USERNAME}",
      "password": "${MYSQL_PASSWORD}",
      "database_pattern": {
        "deny": [
          "^information_schema$",
          "^mysql$",
          "^performance_schema$",
          "^sys$"
        ]
      },
      "include_tables": true,
      "include_views": true,
      "profiling": {
        "enabled": false
      },
      "platform_instance": "mysql_bach_inventory",
      "env": "PROD"
    }
  },
  "sink": {
    "type": "datahub-rest",
    "config": {
      "server": "http://localhost:8080",
      "token": "${DATAHUB_GMS_TOKEN}"
    }
  }
}
