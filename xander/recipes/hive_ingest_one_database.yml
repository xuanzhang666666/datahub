# Hive Metastore (Thrift) — 单库全量同步到 DataHub（参考配置）。
#
# 用法 A（整库，旧流程，脚本已归档）:
#   见 xander/archive/deprecated-run/ingest_hive_database_to_datahub.sh
#
# 用法 B（7w+ 等「只同步给定表名列表」，当前 Jenkins 推荐）:
#   从 xlsx 串行 ingest:
#     bash xander/run/ingest_hive_table_list_serial_from_xlsx.sh
#   或单步:
#     export HIVE_INGEST_TABLE_LIST_FILE=/path/tables.txt
#     bash xander/run/ingest_hive_table_list_to_datahub.sh
#   详见 xander/run/render_hive_ingest_recipe.py
#
# 临时表名过滤: tmp_ / temp_ / bak_tmp / not_verified_ 前缀不入库。
# include_column_lineage: false — 列级血缘由其它 ingestion 维护。
#
# 环境: HMS_THRIFT_HOST, HMS_THRIFT_PORT, DATAHUB_GMS_URL, HIVE_INGEST_DATABASE（整库模式必填）, DATAHUB_GMS_TOKEN
#
source:
  type: hive-metastore
  config:
    connection_type: thrift
    host_port: "${HMS_THRIFT_HOST}:${HMS_THRIFT_PORT}"
    use_kerberos: false

    # 须与 job_info_sync_datahub / datahub_writer 一致，否则 URN 与血缘不是同一 Dataset。
    platform_instance: "blf-prod-hive"

    env: PROD
    emit_storage_lineage: false
    hive_storage_lineage_direction: upstream
    include_column_lineage: false
    include_view_lineage: true

    database_pattern:
      allow:
        - "^${HIVE_INGEST_DATABASE}$"

    table_pattern:
      allow:
        - "^${HIVE_INGEST_DATABASE}\\..*$"
      deny:
        - "^${HIVE_INGEST_DATABASE}\\.tmp_.*$"
        - "^${HIVE_INGEST_DATABASE}\\.temp_.*$"
        - "^${HIVE_INGEST_DATABASE}\\.bak_tmp.*$"
        - "^${HIVE_INGEST_DATABASE}\\.not_verified_.*$"

sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS_URL}"
