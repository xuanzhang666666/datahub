# Hive Metastore (Thrift) — 将「单个 Hive 库」下全部表/视图同步到 DataHub。
#
# 运行前由脚本 export HIVE_INGEST_DATABASE=<库名>（如 data_logistics、default）。
# 临时表名过滤: tmp_ / bak_tmp / not_verified_ 前缀的表不入库（含 not_verified_tmp）。
# include_column_lineage 为 false：减轻 HMS/CLI 负担；列级血缘可由其它 ingestion（如血缘脚本）维护。
#
# 环境: HMS_THRIFT_HOST, HMS_THRIFT_PORT, DATAHUB_GMS_URL, HIVE_INGEST_DATABASE（必填）, 可选 DATAHUB_GMS_TOKEN
#
source:
  type: hive-metastore
  config:
    connection_type: thrift
    host_port: "${HMS_THRIFT_HOST}:${HMS_THRIFT_PORT}"
    use_kerberos: false

    env: PROD
    emit_storage_lineage: false
    hive_storage_lineage_direction: upstream
    include_column_lineage: false
    include_view_lineage: true

    database_pattern:
      allow:
        - "^${HIVE_INGEST_DATABASE}$"
    table_pattern:
      allow:
        - "^${HIVE_INGEST_DATABASE}\\..*$"
      deny:
        - "^${HIVE_INGEST_DATABASE}\\.tmp_.*$"
        - "^${HIVE_INGEST_DATABASE}\\.bak_tmp.*$"
        - "^${HIVE_INGEST_DATABASE}\\.not_verified_.*$"

sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS_URL}"
