# Hive Metastore (Thrift) — ingest all tables/views in default + selected data_* databases
#
# Broader unified recipe (incl. data_drink): xander/recipes/hive_metastore_blf_prod_core_dbs.yml
# data_finance (separate recipe + temp-table filters): xander/recipes/hive_metastore_data_finance.yml
#
# Databases (exact list):
#   default,
#   data_build, data_ic, data_logistics, data_md, data_promotion, data_shop,
#   data_smartorder, data_smartorder_dev, data_supplychain, data_support,
#   data_takeaway, data_tech, data_userinsight, data_userresearch
#
# URN pattern:
#   urn:li:dataset:(urn:li:dataPlatform:hive,blf-prod-hive.<db>.<table>,PROD)
#
# Prerequisites: pip install 'acryl-datahub[hive-metastore]'
# Browse stability: keep env PROD + platform_instance blf-prod-hive identical across runs.
# Omit catalog_name unless HMS lists DBs under that catalog; @hive# returning [] caused 0 DBs.
# Runtime: HMS_THRIFT_HOST, HMS_THRIFT_PORT, DATAHUB_GMS_URL, optional DATAHUB_GMS_TOKEN
#
source:
  type: hive-metastore
  config:
    connection_type: thrift
    host_port: "${HMS_THRIFT_HOST}:${HMS_THRIFT_PORT}"
    use_kerberos: false

    env: PROD
    platform_instance: blf-prod-hive
    emit_storage_lineage: false
    hive_storage_lineage_direction: upstream
    include_column_lineage: true
    include_view_lineage: true

    database_pattern:
      allow:
        - "^default$"
        - "^data_(build|ic|logistics|md|promotion|shop|smartorder|smartorder_dev|supplychain|support|takeaway|tech|userinsight|userresearch)$"
    table_pattern:
      allow:
        - "^default\\..*$"
        - "^data_(build|ic|logistics|md|promotion|shop|smartorder|smartorder_dev|supplychain|support|takeaway|tech|userinsight|userresearch)\\..*$"

sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS_URL}"
