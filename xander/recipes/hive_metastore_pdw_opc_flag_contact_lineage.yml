# Hive Metastore (Thrift) — schema/properties for default.pdw_opc_flag_contact
#
# Dataset URN: urn:li:dataset:(urn:li:dataPlatform:hive,blf-prod-hive.default.pdw_opc_flag_contact,PROD)
#
# IMPORTANT: this connector does NOT emit ODS→PDW table-to-table lineage for normal Hive tables.
# It only adds storage↔Hive edges when emit_storage_lineage=true, and SQL-based edges for views
# when include_view_lineage=true. For explicit upstream edges use:
#   xander/python/emit_explicit_hive_upstream_lineage.py
#
# Prerequisites: pip install 'acryl-datahub[hive-metastore]' (inside datahub-actions image)
# Runtime: HMS_THRIFT_HOST, HMS_THRIFT_PORT, DATAHUB_GMS_URL, optional DATAHUB_GMS_TOKEN
#
source:
  type: hive-metastore
  config:
    connection_type: thrift
    host_port: "${HMS_THRIFT_HOST}:${HMS_THRIFT_PORT}"
    use_kerberos: false

    env: PROD
    platform_instance: blf-prod-hive
    emit_storage_lineage: false
    hive_storage_lineage_direction: upstream
    # Fine-grained column lineage here applies when storage lineage is emitted; see header note.
    include_column_lineage: true
    include_view_lineage: false

    database_pattern:
      allow:
        - "^default$"
    table_pattern:
      allow:
        - "^default\\.pdw_opc_flag_contact$"

sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS_URL}"
