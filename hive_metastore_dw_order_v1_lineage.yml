# Hive Metastore (Thrift) — metadata + storage lineage for default.dw_order_v1
#
# Matches dataset URN: urn:li:dataset:(urn:li:dataPlatform:hive,blf-prod-hive.default.dw_order_v1,PROD)
#
# Prerequisites: pip install 'acryl-datahub[hive-metastore]'
# Env (see ../run_hive_metastore_dw_order_v1_lineage_ingest.example.sh):
#   HMS_THRIFT_HOST, HMS_THRIFT_PORT, DATAHUB_GMS_URL, optional DATAHUB_GMS_TOKEN
#
source:
  type: hive-metastore
  config:
    connection_type: thrift
    host_port: "${HMS_THRIFT_HOST}:${HMS_THRIFT_PORT}"
    use_kerberos: false

    platform_instance: blf-prod-hive
    emit_storage_lineage: true
    hive_storage_lineage_direction: upstream
    include_column_lineage: false
    include_view_lineage: false

    database_pattern:
      allow:
        - "^default$"
    table_pattern:
      allow:
        - "^default\\.dw_order_v1$"

sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS_URL}"
